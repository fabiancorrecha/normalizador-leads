name: ci
on: [pull_request]

# Mínimo privilegio: el token de GitHub de este workflow solo puede leer el repositorio.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Acciones fijadas por SHA (la etiqueta puede moverse; el commit no). Dependabot las actualiza.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - run: pip install pytest pip-audit pyyaml
      # Dependencias de desarrollo del proyecto, incluidas las de LINT_CMD (p. ej. ruff).
      - run: if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
      # Si tu stack es Node: añade actions/setup-node (fijada por SHA, como arriba) y `npm ci` aquí.
      # Mismo gate que el hook Stop: nunca se confía en que el agente lo haya ejecutado.
      - run: make check
      - run: make seguridad
      - name: Cambios pequeños y revisables
        run: |
          lines=$(git diff --numstat origin/${{ github.base_ref }}...HEAD | awk '{s+=$1+$2} END {print s+0}')
          echo "Líneas cambiadas: $lines"; test "$lines" -le 400
