# Diccionario semántico (ADR-0001): cómo se reconoce cada campo del esquema común en el export de
# cualquier clínica. Es configuración: un sinónimo nuevo sirve para todas las clínicas sin tocar código.
# Los nombres se comparan en minúsculas, sin tildes y con `_` o `-` como espacios.
version: 1

# Reranking: puntuación = peso_nombre × nombre + peso_contenido × contenido.
#   nombre: 1,0 si el campo de origen es un sinónimo exacto; 0,5 si comparte una parte (`correo_electronico`
#           y `correo`); 0 si no.
#   contenido: % de valores presentes que pasan el validador del campo.
# Un campo se mapea si el mejor candidato llega al umbral y saca al segundo al menos el margen; si no,
# queda sin mapear con `mapeo_dudoso` y el perfil puede fijarlo (REQ-NOR-014 y 015).
# Pesos, umbral y margen son supuestos iniciales: calibrar con el histórico de calidad (T-001-8).
mapeo:
  peso_nombre: 0.5
  peso_contenido: 0.5
  umbral: 0.6
  margen: 0.15

# Validadores: identificador, nombre, email, telefono, pais, fecha, texto (dominio/diccionario.py).
campos:
  lead_id:
    validador: identificador
    sinonimos: [id, ref, referencia, reference, identificador, identifier, lead_id, codigo, code,
                numero, number, nr, external_id, record_id, id_lead, id_paciente, patient_id, uid]
  full_name:
    validador: nombre
    sinonimos: [nombre_completo, nombre_y_apellidos, full_name, fullname, name, paciente, patient,
                patient_name, contact_name, nome_completo, nom_complet, nom_et_prenom,
                vollständiger_name, imię_i_nazwisko, фио, полное_имя]
    # Cuando el nombre viene en dos campos: una lista de sinónimos por parte, en orden.
    composicion:
      - [first_name, firstname, given_name, nombre, nome, prenom, prénom, vorname, imię, imie, имя]
      - [last_name, lastname, surname, family_name, apellidos, apellido, cognome, nom, nachname,
         nazwisko, фамилия, apelido, sobrenome]
  email:
    validador: email
    sinonimos: [email, e_mail, mail, correo, correo_electronico, email_address, emailaddress,
                courriel, adresse_email, posta_elettronica, adres_email, почта, эл_почта, e_mail_adresse]
  phone:
    validador: telefono
    sinonimos: [tel, telefono, telephone, phone, phone_number, mobile, movil, celular, cell, cellphone,
                whatsapp, telefono_movil, numero_de_telefono, telefon, telefone, portable, gsm, handy,
                телефон, mobilny, numero]
  country:
    validador: pais
    sinonimos: [pais, country, residence, residencia, pais_de_residencia, pais_residencia,
                country_of_residence, nationality, nacionalidad, pays, paese, land, kraj, страна,
                country_code, codigo_pais]
  created_at:
    validador: fecha
    sinonimos: [fecha_alta, fecha, fecha_registro, fecha_creacion, fecha_de_alta, fecha_contacto,
                created_at, created, created_on, received_at, received, date, timestamp, inserted_at,
                submitted_at, data, datum, date_creation, data_creazione, дата, дата_создания]
  enquiry_text:
    validador: texto
    sinonimos: [mensaje, enquiry, inquiry, consulta, message, texto, text, comentarios, comments,
                comment, motivo, descripcion, description, notas, notes, body, query, richiesta,
                demande, anfrage, сообщение, wiadomość, wiadomosc, mensagem, observaciones]

